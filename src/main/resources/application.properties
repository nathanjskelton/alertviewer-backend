server.port=8085
logging.level.net.njsdomain=INFO
spring.data.mongodb.database=AlertViewer
files.path=/opt/lv/csv
ingest.fixedrate=30000
ingester.type=alertmanager
management.endpoints.web.exposure.include=prometheus
initial.days.ago=5

security.require-ssl=true
login.username=user
login.password=p_ssword1

spring.data.mongodb.port=27017
spring.data.mongodb.host=localhost

#where wraith is. Everything jira goes through it, so leaving this blank turns jira
#off altogether: no tickets raised, no ticket states refreshed, resolved alerts expire
#on age alone, and the UI drops its jira controls
#wraith.base.url=http://localhost:5000
#base of the jira instance tickets are created in; used to link an alert to its ticket
jira.base.url=https://jira.evoforge.org
#label an alert may carry instead of "environment". When an alert has no environment
#of its own, this label's value is used as one. Leave it blank to turn that off
environment.label.alternative=gm_instance
testmode.enabled=false

build.version=@project.version@

